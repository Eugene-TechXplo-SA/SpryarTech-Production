  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{production}}/{{path}}">

  <!-- Social sharing (Open Graph / Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Spryar Tech">
  <meta property="og:locale" content="en_ZA">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site}}/{{path}}">
  <meta property="og:image" content="{{site}}/og-image.jpg">
  <meta property="og:image:secure_url" content="{{site}}/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Spryar Tech — Beyond Technology">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}/og-image.jpg">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0f1614">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Structured data: tells search engines who Spryar Tech is, where it is and what it does -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "@id": "https://www.spryartech.co.za/#organization",
    "name": "Spryar Tech",
    "legalName": "Spryar Tech (Pty) Ltd",
    "slogan": "Beyond Technology",
    "description": "Multidisciplinary engineering and data consultancy providing infrastructure engineering, physical asset management, data engineering and GIS & spatial analytics in South Africa.",
    "url": "https://www.spryartech.co.za/",
    "logo": "{{site}}/brand/logo-dark.png",
    "image": "{{site}}/og-image.jpg",
    "telephone": "+27-87-265-6818",
    "email": "info@spryartech.co.za",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "11th Floor, Sandton City Towers, Cnr 5th St & Rivonia Road",
      "addressLocality": "Sandton",
      "addressRegion": "Gauteng",
      "postalCode": "2196",
      "addressCountry": "ZA"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": -26.1076, "longitude": 28.0567 },
    "areaServed": [
      { "@type": "Country", "name": "South Africa" },
      { "@type": "Place", "name": "Southern Africa" }
    ],
    "knowsAbout": [
      "Infrastructure engineering", "Physical asset management", "Asset condition assessment",
      "Asset valuation", "Data engineering", "Snowflake", "Cloud data architecture",
      "GIS", "Spatial analytics", "Geospatial risk modelling", "SHERQ compliance", "EPCM"
    ],
    "employee": [
      { "@type": "Person", "name": "Herbert Zulu", "jobTitle": "Chief Executive Officer" },
      { "@type": "Person", "name": "Andile Gwebu", "jobTitle": "Head: Asset Management" },
      { "@type": "Person", "name": "Thulani Tshabalala", "jobTitle": "Head: GIS & Spatial Modelling" }
    ]
  }
  </script>
